# DegenBench pre-registered pass/fail criteria.
#
# Committed before any result on real data exists. Any later change must be a
# separate, dated commit with its reason in the message, and results must be
# reported against the version that was in force when they were produced.

version: 5

# Version history
# - 1 (2026-11-09): initial pre-registration.
# - 2 (2026-11-11): label offsets reduced from +-0.5 m / +-5 deg to
#   +-0.2 m / +-4 deg. Reason: on SubT-MRS Laurel Caverns (development
#   sequence) the v1 probe mixed observability with each solver's convergence
#   basin (docs/results/2026-11-10-subt-mrs-laurel-caverns.md), and solver
#   agreement was 72.1% against the 90% pass condition. The new range is set by
#   a rule fixed in advance, not fitted to that sequence: the smallest uniform
#   offsets for which a truly free direction still scores a normalized
#   eigenvalue of at least 4/3, i.e. >= 4 sigma above the threshold of 1 given
#   the ~6% relative sampling noise of a 200-sample second moment. Free
#   direction eigenvalue = (b / sqrt(3) / threshold)^2, so b >= 0.2 m and
#   b >= 4 deg. The v1 range is kept as a separate, secondary output
#   (robustness_probe). All pass conditions are unchanged. v2 is evaluated on
#   SubT-MRS Corridor01, which no method decision has seen; Laurel Caverns
#   results under v2 are reported as development results only.
# - 3 (2026-11-12): release and scoring rules under the plan's fallback for
#   solver-dependent labels, fixed before any detector has been scored. Reason:
#   v2 failed the solver-agreement pass condition on the held-out sequence
#   (85.9% vs 90%, docs/results/2026-11-11-subt-mrs-corridor01-thresholds-v2.md).
#   Label generation is unchanged from v2; every pass condition is unchanged
#   and the label pass condition stays FAIL. Added: labels.release (frame
#   status, consensus subspace, per-axis rule), leaderboard.scoring (headline on
#   consensus frames, disputed frames reported separately) and the
#   frame-detection metric.
# - 4 (2026-11-12): detector protocol, fixed before any detector has been run
#   on real data. Adds leaderboard.detectors (the five scored detectors, their
#   inputs and published thresholds) and leaderboard.calibration (one scalar
#   per detector, fitted on development sequences only). Nothing else changes.
# - 5 (2026-11-12): evaluation sets for the next round, fixed before any
#   data of the new sequences has been processed. Corridor01 has been used as
#   the held-out sequence for labels v2 and leaderboard v0.1 and now moves to
#   development; SubT-MRS Floor01 and Corridor02 become held out. Reason: v4
#   calibration on Laurel Caverns alone failed because its consensus free
#   directions are not geometric (docs/results/2026-11-12-detector-leaderboard-v0.1.md);
#   pooling Corridor01 gives calibration geometric positives. The calibration
#   rule itself is unchanged. Labels and every pass condition are unchanged.

# ---------------------------------------------------------------------------
# Label generation
# ---------------------------------------------------------------------------
labels:
  monte_carlo:
    num_samples: 200
    frame_rate_hz: 1.0
    max_offset_trans_m: 0.2     # uniform per axis
    max_offset_rot_deg: 4.0     # uniform per axis
  # Secondary output, not the label: whether each solver recovers from the
  # wider v1 offsets. Reported per frame, never used for pass/fail.
  robustness_probe:
    max_offset_trans_m: 0.5
    max_offset_rot_deg: 5.0
  evaluation:
    development_sequences: [subt_mrs/laurel_caverns_handheld3, subt_mrs/corridor01]
    held_out_sequences: [subt_mrs/floor01, subt_mrs/corridor02]
    # Earlier rounds, for the record: v2-v4 held out subt_mrs/corridor01.
  # A direction is degenerate when the RMS final registration error along it,
  # in threshold-normalized coordinates (t / 0.10 m, r / 2 deg), exceeds 1.
  degeneracy_threshold:
    trans_m: 0.10
    rot_deg: 2.0
  solvers: [point_to_plane_icp, gicp]
  # The two solvers agree on a frame when their degenerate subspaces have the
  # same dimension and the largest principal angle between them (normalized
  # coordinates) is at most this.
  solver_agreement_max_principal_angle_deg: 15.0

  # Release under the fallback (v3). Every frame keeps both solvers' results
  # and continuous errors; none is dropped.
  release:
    frame_status:
      consensus: reference refinement converged and the solvers agree
      disputed: reference refinement converged and the solvers disagree
      unreliable_reference: reference refinement did not converge
    # Consensus subspace of dimension k: top-k eigenvectors of the mean of the
    # two solvers' orthogonal projectors.
    consensus_subspace: mean_projector_top_k
    # Axis i (tx..rz) counts as free when the subspace projector's diagonal
    # entry P_ii exceeds this; used for per-direction metrics and applied
    # identically to labels and predictions.
    axis_free_min_projection: 0.5

  pass:
    analytic_scenes:
      # Every scene must return exactly its known number of free directions,
      # with both solvers.
      plane: 3
      corridor: 1
      cylinder: 2
      corner: 0
    real_frames:
      min_solver_agreement_rate: 0.90   # disagreeing frames are flagged, not dropped
    visual_spot_check_frames: 50

# ---------------------------------------------------------------------------
# Detector leaderboard
# ---------------------------------------------------------------------------
leaderboard:
  pass:
    min_detectors: 5
    min_datasets: 3
    min_lidar_types: 2
  # Every detector is evaluated at the label's reference pose with the same
  # correspondences as the labeler: scan and map (after 0.2 m map voxels) both
  # prepared at 0.25 m with normals from 10 neighbours, nearest map point
  # within 1.0 m.
  # Parameters [tx ty tz rx ry rz] in m and rad; predicted subspaces are mapped
  # to normalized coordinates (t / 0.10 m, r / 2 deg) before scoring. All are
  # reimplementations from the papers (detectors/, leaderboard detectors.py).
  detectors:
    min_eigenvalue:       # Zhang, Kaess, Singh 2016: eig(H), flag lambda < tau
      published: []
    condition_number:     # eig(H), flag lambda_max / lambda > tau
      published: []
    x_icp:                # Tuna et al. 2023: block eigvecs not fully localizable
      kappa_f: 0.1736     # cos 80 deg (paper, Velodyne)
      kappa: [250, 180, 35]
      published: [1.0]    # scale on kappa
    dcreg:                # Schur complements per block, flag lambda_max / lambda > tau
      published: [10, 50] # "typically between 10 and 50"
    frame_independent:    # generalized eig H v = lambda M v, flag lambda < tau
      published: [0.01]
  calibration:
    # One scalar per detector (X-ICP: a common scale on kappa), chosen on the
    # consensus frames of the development sequences only, then frozen and
    # applied unchanged to held-out sequences.
    sequences: development
    objective: per_direction_micro_f1
    grid: 200 log-spaced values spanning the detector's scores on those frames
    tie_break: geometric middle of the first contiguous run at the maximum
    # The leaderboard headline is each detector's calibrated variant on the
    # held-out sequences; published variants are reported next to it.
    headline: calibrated_on_held_out
  scoring:
    # Headline metrics use consensus frames only. Disputed frames are scored
    # separately against each solver and reported, never folded into the
    # headline. Unreliable-reference frames are not scored.
    headline_frames: consensus
    disputed_frames: reported_against_each_solver
    # A frame without a prediction counts as "no degeneracy" and is reported.
    missing_prediction: k_zero
  metrics:
    - subspace_error_deg          # largest principal angle, predicted vs labelled
    - per_direction_precision
    - per_direction_recall
    - per_direction_f1
    - frame_detection_f1          # degenerate (k > 0) or not, per frame
    - detection_delay_s           # at tunnel entry
    - false_alarms_per_km
    - runtime_ms_per_scan

# ---------------------------------------------------------------------------
# Trajectory definitions shared by the monitor and LIO criteria
# ---------------------------------------------------------------------------
trajectory:
  # Estimated trajectories are aligned to ground truth with an SE(3) Umeyama fit
  # on the first `alignment_window_s` seconds only, never on the whole run, so that
  # later drift is not hidden by the alignment. The fit uses positions only, since
  # ENWIDE and part of GEODE provide position-only total-station ground truth.
  alignment_window_s: 10.0
  # Drift onset: first time the aligned position error exceeds this.
  drift_onset_position_error_m: 0.5
  # Divergence: aligned position error exceeds this at any time, or the
  # estimator crashes or outputs a non-finite pose.
  divergence_position_error_m: 5.0
  tool: evo
  metrics: [ate_rmse_m, rpe_per_100m, end_point_error_m]

# ---------------------------------------------------------------------------
# degen_monitor
# ---------------------------------------------------------------------------
degen_monitor:
  pass:
    max_runtime_ms_per_scan: 10.0      # laptop CPU, single scan, median and p95 reported
    # A flag counts once the monitor reports degeneracy continuously for this long.
    min_sustained_flag_s: 1.0
    # The sustained flag must start before stock FAST-LIO2's drift onset on the
    # ENWIDE tunnel sequences.
    flag_before_fastlio2_drift_onset:
      dataset: enwide
      sequences: [tunnel_s, tunnel_d]

# ---------------------------------------------------------------------------
# Degeneracy-aware LIO (FAST-LIO2 fork)
# ---------------------------------------------------------------------------
degen_lio:
  pass:
    no_divergence:
      dataset: enwide
      sequences: [tunnel_s, tunnel_d]
      max_divergences: 0
    wheel_fusion:
      dataset: m3dgr
      sequences: [corridor01, corridor02]
      # End-point error must be lower than stock FAST-LIO2 on each sequence.
      beats_fastlio2_end_point_error: true
    max_added_runtime_fraction: 0.10   # vs stock FAST-LIO2, per scan
    geode_report:
      dataset: geode
      sequences: shield_tunnel
      compare_to: DeCOD published ATE   # report win or lose, no pass threshold
