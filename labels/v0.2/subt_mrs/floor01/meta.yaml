    max_offset_rot_deg: 4.0
  degeneracy_threshold:
    trans_m: 0.1
    rot_deg: 2.0
  solvers:
  - point_to_plane_icp
  - gicp
  solver_agreement_max_principal_angle_deg: 15.0
